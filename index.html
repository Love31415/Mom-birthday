<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妈妈，生日快乐 🎂</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #5b2c46 0%, #3a1c33 45%, #1e1120 100%);
    color: #fff;
    overflow-x: hidden;
  }

  /* ============ 漂浮爱心背景 ============ */
  .hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .heart {
    position: absolute;
    bottom: -10vh;
    opacity: 0;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    filter: drop-shadow(0 0 8px rgba(255, 150, 180, 0.55));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(.6); opacity: 0; }
    12%  { opacity: .9; }
    85%  { opacity: .8; }
    100% { transform: translateY(-115vh) rotate(320deg) scale(1.1); opacity: 0; }
  }

  /* ============ 卡片 ============ */
  .card {
    position: relative;
    z-index: 2;
    width: min(480px, 100%);
    padding: 36px 26px 34px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 214, 224, 0.28);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    animation: cardIn .9s cubic-bezier(.2, .8, .3, 1) both;
    transition: box-shadow .9s ease;
  }
  .card.lit {
    box-shadow: 0 26px 80px rgba(255, 160, 110, .35),
                0 0 0 1px rgba(255, 200, 150, .25),
                inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(34px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ 蛋糕 ============ */
  .cake {
    width: 170px;
    margin: 0 auto 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .candle {
    position: relative;
    width: 11px;
    height: 44px;
    margin-bottom: -6px;
    border-radius: 5px;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #ffb3c6 6px 12px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .35);
    z-index: 2;
  }
  .flame {
    position: absolute;
    left: 50%;
    top: -21px;
    width: 15px;
    height: 22px;
    transform: translateX(-50%) scale(0);
    transform-origin: bottom center;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: radial-gradient(circle at 50% 72%,
                #fffbe0 0%, #ffd166 42%, #ff8c42 76%, rgba(255, 110, 60, 0) 100%);
    box-shadow: 0 0 24px 9px rgba(255, 170, 80, .7);
    transition: transform .5s cubic-bezier(.2, 1.7, .5, 1);
  }
  .cake.lit .flame {
    transform: translateX(-50%) scale(1);
    animation: flicker .45s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    0%   { transform: translateX(-50%) scale(1) rotate(-2.5deg); opacity: .9; }
    100% { transform: translateX(-50%) scale(1.15) rotate(2.5deg); opacity: 1; }
  }

  .layer { width: 100%; position: relative; }
  .layer.top {
    width: 112px;
    height: 30px;
    border-radius: 14px 14px 8px 8px;
    background: linear-gradient(#fff2f5, #ffc2d1);
  }
  .layer.bottom {
    width: 152px;
    height: 40px;
    margin-top: 3px;
    border-radius: 16px 16px 12px 12px;
    background: linear-gradient(#ffe0e7, #f79ab0);
  }
  .plate {
    width: 190px;
    height: 11px;
    margin-top: 7px;
    border-radius: 50%;
    background: linear-gradient(rgba(255, 255, 255, .6), rgba(255, 255, 255, .12));
    box-shadow: 0 10px 26px rgba(0, 0, 0, .4);
  }

  /* ============ 文字 ============ */
  h1 {
    font-size: clamp(26px, 7.2vw, 34px);
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd6e0, #ffb3c6, #ffd9a0, #ffb3c6, #ffd6e0);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 7s linear infinite;
  }
  @keyframes shine { to { background-position: 220% center; } }

  .sub {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(255, 214, 224, .62);
  }

  /* ============ 祝福语 ============ */
  .wish {
    margin-top: 20px;
    display: grid;
    gap: 9px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .9s ease, opacity .7s ease .15s;
  }
  .wish.show {
    max-height: 360px;
    opacity: 1;
  }
  .wish p {
    font-size: 15px;
    line-height: 1.75;
    color: #ffe6ee;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .wish.show p { opacity: 1; transform: none; }
  .wish.show p:nth-child(1) { transition-delay: .30s; }
  .wish.show p:nth-child(2) { transition-delay: .45s; }
  .wish.show p:nth-child(3) { transition-delay: .60s; }
  .wish.show p:nth-child(4) { transition-delay: .75s; }
  .wish.show p:nth-child(5) { transition-delay: .92s; }
  .wish .last {
    margin-top: 6px;
    font-size: 16.5px;
    font-weight: 700;
    color: #ffd9a0;
    letter-spacing: 1px;
  }

  /* ============ 按钮 ============ */
  .btn {
    margin-top: 24px;
    padding: 13px 34px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #5a1f34;
    background: linear-gradient(135deg, #ffd6e0, #ffb3c6 45%, #ffd9a0);
    box-shadow: 0 12px 26px rgba(255, 150, 180, .38);
    cursor: pointer;
    transition: transform .22s ease, box-shadow .22s ease, background .5s ease;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 16px 32px rgba(255, 150, 180, .55);
  }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.97); }
  .btn.done {
    background: linear-gradient(135deg, #ffe9ef, #ffd6e0);
    color: #a8668a;
    box-shadow: none;
    cursor: default;
  }

  @media (max-width: 380px) {
    .card { padding: 30px 18px 28px; }
    .wish p { font-size: 14px; }
  }
</style>
</head>
<body>

  <!-- 漂浮爱心容器 -->
  <div class="hearts" id="hearts"></div>

  <main class="card" id="card">

    <!-- 蛋糕 -->
    <div class="cake" id="cake">
      <div class="candle"><div class="flame"></div></div>
      <div class="layer top"></div>
      <div class="layer bottom"></div>
      <div class="plate"></div>
    </div>

    <h1>妈妈，生日快乐</h1>
    <p class="sub">Happy Birthday, Mom</p >

    <!-- 祝福语（点击后展开） -->
    <div class="wish" id="wish">
      <p>亲爱的黄女士，今天是您的生日，</p >
      <p>谢谢您把最好的年华，都给了我。</p >
      <p>愿往后的日子，您少一点操劳，多一点欢喜；</p >
      <p>愿岁月对您温柔，愿您眉眼常带笑意。</p >
      <p class="last">生日快乐❤️</p >
    </div>

    <button class="btn" id="btn">🕯️ 点亮蜡烛，送上祝福</button>
  </main>

<script>
  const heartsBox = document.getElementById('hearts');
  const cake      = document.getElementById('cake');
  const card      = document.getElementById('card');
  const wish      = document.getElementById('wish');
  const btn       = document.getElementById('btn');

  const EMOJIS = ['💗', '💖', '🌸', '💕', '✨', '🌷', '💝'];

  /* 生成一颗飘浮爱心 */
  function createHeart(burst = false) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 20) + 'px';

    const duration = burst ? (2.4 + Math.random() * 1.8) : (8 + Math.random() * 6);
    const delay = burst ? Math.random() * 0.4 : Math.random() * 2;

    h.style.animationDuration = duration + 's';
    h.style.animationDelay = delay + 's';

    heartsBox.appendChild(h);
    setTimeout(() => h.remove(), (duration + delay + 0.6) * 1000);
  }

  /* 背景常驻飘心 */
  for (let i = 0; i < 8; i++) createHeart();
  setInterval(() => createHeart(), 900);

  /* 点击按钮：点亮蜡烛 + 绽放爱心 + 展示祝福 */
  btn.addEventListener('click', () => {
    cake.classList.add('lit');
    card.classList.add('lit');
    wish.classList.add('show');

    for (let i = 0; i < 30; i++) createHeart(true);

    btn.textContent = '❤️ 祝福已送达';
    btn.classList.add('done');
    btn.disabled = true;
  });
</script>
</body>
</html>
